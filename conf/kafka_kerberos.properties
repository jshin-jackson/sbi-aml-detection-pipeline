# =============================================================================
# Kafka Kerberos SASL_SSL 클라이언트 설정
# kafka-topics.sh, kafka-console-producer/consumer 등의 --command-config 옵션에 사용
#
# 사용 예:
#   export KAFKA_OPTS="-Djava.security.auth.login.config=conf/kafka_jaas.conf"
#   kafka-topics.sh \
#     --bootstrap-server ${KAFKA_BROKERS} \
#     --command-config conf/kafka_kerberos.properties \
#     --list
#
# 참고: infra/01_kafka_setup.sh 는 JAAS 및 client.properties 를
#       conf/ 파일을 기반으로 자동 렌더링하므로 직접 수정이 필요 없습니다.
# =============================================================================

# 보안 프로토콜
security.protocol=SASL_SSL
sasl.mechanism=GSSAPI
sasl.kerberos.service.name=kafka

# JAAS 설정 — KAFKA_OPTS 환경변수로 jaas.conf를 지정하거나
#              아래 sasl.jaas.config를 직접 사용하세요.
sasl.jaas.config=com.sun.security.auth.module.Krb5LoginModule required \
  useKeyTab=true \
  storeKey=true \
  keyTab="${KAFKA_KEYTAB}" \
  principal="${KAFKA_PRINCIPAL}";

# SSL Truststore — CDP Auto-TLS
ssl.truststore.location=${TRUSTSTORE_JKS}
ssl.truststore.password=${TRUSTSTORE_PW}
ssl.truststore.type=JKS

# 연결 타임아웃
request.timeout.ms=30000
connections.max.idle.ms=540000
