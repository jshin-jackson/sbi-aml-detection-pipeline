# ================================================================
# SBI AML Detection Pipeline — Environment Configuration
# Target : Cloudera Internal Test Environment
# ================================================================
# 사용법:
#   Shell : source config/env.conf   (export 자동 적용 — Python 자식 프로세스에도 전달)
#   환경 전환: ln -sf config/env.internal.conf config/env.conf
# ================================================================

export ENV_NAME="cloudera-internal"

# ----------------------------------------------------------------
# Kerberos (단일 계정: systest)
# ----------------------------------------------------------------
export KRB_REALM="ROOT.COMOPS.SITE"
export KRB_KDC="ccycloud-1.jshin.root.comops.site"
export PRINCIPAL="systest@ROOT.COMOPS.SITE"
export KEYTAB="/opt/cloudera/systest.keytab"

# ----------------------------------------------------------------
# Auto-TLS 인증서 경로 (CDP 표준 — 대부분의 환경에서 동일)
# ----------------------------------------------------------------
export TRUSTSTORE_JKS="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_truststore.jks"
export INCLUSTER_TRUSTSTORE_JKS="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-in_cluster_truststore.jks"
export CA_PEM="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_cacerts.pem"

# Truststore 패스워드 (Auto-TLS 환경에서 모든 컴포넌트 동일)
export TRUSTSTORE_PW="zpXWTjeWPjvNDU4mQnDQPQKn50xfVI9HYX12DSc05x3"

# ----------------------------------------------------------------
# Kafka 전용 인증 설정 (conf/kafka_jaas.conf, conf/kafka_kerberos.properties 참조)
# ----------------------------------------------------------------
export KAFKA_KEYTAB="${KEYTAB}"
export KAFKA_PRINCIPAL="${PRINCIPAL}"
export KAFKA_CA_PEM="${CA_PEM}"

# Kafka 설치 경로
export KAFKA_HOME="/opt/cloudera/parcels/CDH/lib/kafka"

# ----------------------------------------------------------------
# Kafka
# ----------------------------------------------------------------
export KAFKA_BROKERS="ccycloud-1.jshin.root.comops.site:9093,ccycloud-2.jshin.root.comops.site:9093,ccycloud-3.jshin.root.comops.site:9093"
export KAFKA_TOPIC_TXN="sbi-aml-transactions"
export KAFKA_TOPIC_ALERTS="sbi-aml-alerts"
export KAFKA_PARTITIONS=4
export KAFKA_RF=3

# ----------------------------------------------------------------
# Kudu (Master 주소 — 실제 호스트명으로 변경)
# ----------------------------------------------------------------
export KUDU_MASTERS="ccycloud-1.jshin.root.comops.site:7051"
export KUDU_DB="default"

# ----------------------------------------------------------------
# SQL Stream Builder (SSB)
# ----------------------------------------------------------------
export SSB_HOST="https://ccycloud-1.jshin.root.comops.site:18121"
export SSB_USER="systest"
export SSB_PASSWORD="CHANGEME"

# ----------------------------------------------------------------
# Impala
# ----------------------------------------------------------------
export IMPALA_HOST="ccycloud-2.jshin.root.comops.site"
export IMPALA_PORT="21050"

# ----------------------------------------------------------------
# CFM / NiFi
# ----------------------------------------------------------------
export NIFI_HOST="https://ccycloud-1.jshin.root.comops.site:8443"

# ----------------------------------------------------------------
# Flink (Standalone — CSA 미설치 환경)
# ----------------------------------------------------------------
export FLINK_REST_URL="http://localhost:8081"
export FLINK_HOME="/opt/flink"

# ----------------------------------------------------------------
# 데이터 생성 설정
# ----------------------------------------------------------------
export DATA_OUTPUT_DIR="/tmp/aml-data"
export DEMO_ROWS=2000
export DEMO_RATE=5

# AML 탐지 임계값
export LARGE_CASH_THRESHOLD=1000000      # ₹10 lakh (RBI CTR 기준)
export SMURFING_TXN_COUNT=5              # 30분 내 5회 이상
export SMURFING_WINDOW_MIN=30

# AML 패턴 주입 계좌 (쉼표 구분)
export LARGE_CASH_ACCOUNTS="ACC_AML_LARGE_001,ACC_AML_LARGE_002"
export SMURFING_ACCOUNTS="ACC_AML_SMURF_001,ACC_AML_SMURF_002,ACC_AML_SMURF_003"
