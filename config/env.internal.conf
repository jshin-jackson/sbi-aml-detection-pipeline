# ================================================================
# SBI AML Detection Pipeline — Environment Configuration
# Target : Cloudera Internal Test Environment
# ================================================================
# 사용법:
#   Shell : source config/env.conf
#   Python: load_dotenv("config/env.conf")
# ================================================================

ENV_NAME="cloudera-internal"

# ----------------------------------------------------------------
# Kerberos (단일 계정: systest)
# ----------------------------------------------------------------
KRB_REALM="ROOT.COMOPS.SITE"
KRB_KDC="ccycloud-1.root.comops.site"
PRINCIPAL="systest@ROOT.COMOPS.SITE"
KEYTAB="/opt/cloudera/systest.keytab"

# ----------------------------------------------------------------
# Auto-TLS 인증서 경로 (CDP 표준 — 대부분의 환경에서 동일)
# ----------------------------------------------------------------
TRUSTSTORE_JKS="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_truststore.jks"
INCLUSTER_TRUSTSTORE_JKS="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-in_cluster_truststore.jks"
CA_PEM="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_cacerts.pem"

# Truststore 패스워드 — 직접 입력 (.pw 파일 미사용)
# 확인: sudo openssl pkcs12 -in /path/to/truststore 또는 CM UI에서 확인
TRUSTSTORE_PW="zpXWTjeWPjvNDU4mQnDQPQKn50xfVI9HYX12DSc05x3"

# Kafka 설치 경로
KAFKA_HOME="/opt/cloudera/parcels/CDH/lib/kafka"

# ----------------------------------------------------------------
# Kafka (Broker 주소 — 실제 호스트명으로 변경)
# ----------------------------------------------------------------
KAFKA_BROKERS="ccycloud-1.root.comops.site:9093,ccycloud-2.root.comops.site:9093,ccycloud-3.root.comops.site:9093"
KAFKA_TOPIC_TXN="sbi-aml-transactions"
KAFKA_TOPIC_ALERTS="sbi-aml-alerts"
KAFKA_PARTITIONS=4
KAFKA_RF=3

# ----------------------------------------------------------------
# Kudu (Master 주소 — 실제 호스트명으로 변경)
# ----------------------------------------------------------------
KUDU_MASTERS="ccycloud-1.root.comops.site:7051,ccycloud-2.root.comops.site:7051,ccycloud-3.root.comops.site:7051"
KUDU_DB="default"

# ----------------------------------------------------------------
# SQL Stream Builder (SSB)
# ----------------------------------------------------------------
SSB_HOST="https://ccycloud-1.root.comops.site:18121"
SSB_USER="systest"
SSB_PASSWORD="CHANGEME"

# ----------------------------------------------------------------
# Impala
# ----------------------------------------------------------------
IMPALA_HOST="ccycloud-1.root.comops.site"
IMPALA_PORT="21050"

# ----------------------------------------------------------------
# CFM / NiFi
# ----------------------------------------------------------------
NIFI_HOST="https://ccycloud-1.root.comops.site:8443"

# ----------------------------------------------------------------
# 데이터 생성 설정
# ----------------------------------------------------------------
DATA_OUTPUT_DIR="/tmp/aml-data"
DEMO_ROWS=2000
DEMO_RATE=5

# AML 탐지 임계값
LARGE_CASH_THRESHOLD=1000000      # ₹10 lakh (RBI CTR 기준)
SMURFING_TXN_COUNT=5              # 30분 내 5회 이상
SMURFING_WINDOW_MIN=30

# AML 패턴 주입 계좌 (쉼표 구분)
LARGE_CASH_ACCOUNTS="ACC_AML_LARGE_001,ACC_AML_LARGE_002"
SMURFING_ACCOUNTS="ACC_AML_SMURF_001,ACC_AML_SMURF_002,ACC_AML_SMURF_003"
