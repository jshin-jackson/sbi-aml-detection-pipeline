# ================================================================
# SBI AML Detection Pipeline — Environment Configuration
# Target : SBI Customer Cluster
# ================================================================
# 환경 전환 방법:
#   ln -sf config/env.customer.conf config/env.conf
# ================================================================

ENV_NAME="sbi-customer"

# ----------------------------------------------------------------
# Kerberos — SBI 클러스터 계정 정보로 변경
# ----------------------------------------------------------------
KRB_REALM="CHANGE_ME.DOMAIN"                    # 예: SBI.INTERNAL
KRB_KDC="CHANGE_ME_KDC_HOST"                    # 예: kdc.sbi.internal
PRINCIPAL="CHANGE_ME@CHANGE_ME.DOMAIN"          # 예: demo-user@SBI.INTERNAL
KEYTAB="/opt/cloudera/CHANGE_ME.keytab"         # 예: /opt/cloudera/demo-user.keytab

# ----------------------------------------------------------------
# Auto-TLS 인증서 경로 (CDP 표준 경로 — 변경 불필요)
# ----------------------------------------------------------------
TRUSTSTORE_JKS="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_truststore.jks"
INCLUSTER_TRUSTSTORE_JKS="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-in_cluster_truststore.jks"
CA_PEM="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_cacerts.pem"

# Truststore 패스워드 — SBI 클러스터 값으로 변경
TRUSTSTORE_PW="CHANGE_ME_TRUSTSTORE_PW"

# Kafka 설치 경로
KAFKA_HOME="/opt/cloudera/parcels/CDH/lib/kafka"

# ----------------------------------------------------------------
# Kafka — SBI 클러스터 브로커 호스트명으로 변경
# ----------------------------------------------------------------
KAFKA_BROKERS="CHANGE_ME_BROKER1:9093,CHANGE_ME_BROKER2:9093,CHANGE_ME_BROKER3:9093"
KAFKA_TOPIC_TXN="sbi-aml-transactions"
KAFKA_TOPIC_ALERTS="sbi-aml-alerts"
KAFKA_PARTITIONS=4
KAFKA_RF=3

# ----------------------------------------------------------------
# Kudu — SBI 클러스터 Kudu Master 호스트명으로 변경
# ----------------------------------------------------------------
KUDU_MASTERS="CHANGE_ME_KUDU_MASTER1:7051,CHANGE_ME_KUDU_MASTER2:7051,CHANGE_ME_KUDU_MASTER3:7051"
KUDU_DB="default"

# ----------------------------------------------------------------
# SQL Stream Builder (SSB)
# ----------------------------------------------------------------
SSB_HOST="https://CHANGE_ME_SSB_HOST:18121"
SSB_USER="CHANGE_ME_USER"
SSB_PASSWORD="CHANGE_ME_PASSWORD"

# ----------------------------------------------------------------
# Impala
# ----------------------------------------------------------------
IMPALA_HOST="CHANGE_ME_IMPALA_HOST"
IMPALA_PORT="21050"

# ----------------------------------------------------------------
# CFM / NiFi
# ----------------------------------------------------------------
NIFI_HOST="https://CHANGE_ME_NIFI_HOST:8443"

# ----------------------------------------------------------------
# 데이터 생성 설정 (변경 불필요)
# ----------------------------------------------------------------
DATA_OUTPUT_DIR="/tmp/aml-data"
DEMO_ROWS=2000
DEMO_RATE=5

LARGE_CASH_THRESHOLD=1000000
SMURFING_TXN_COUNT=5
SMURFING_WINDOW_MIN=30

LARGE_CASH_ACCOUNTS="ACC_AML_LARGE_001,ACC_AML_LARGE_002"
SMURFING_ACCOUNTS="ACC_AML_SMURF_001,ACC_AML_SMURF_002,ACC_AML_SMURF_003"
