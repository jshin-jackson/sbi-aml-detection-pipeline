# ================================================================
# SBI AML Detection Pipeline — Environment Configuration
# Target : SBI Customer Cluster
# ================================================================
# 환경 전환 방법:
#   ln -sf config/env.customer.conf config/env.conf
# ================================================================

export ENV_NAME="sbi-customer"

# ----------------------------------------------------------------
# Kerberos — SBI 클러스터 계정 정보로 변경
# ----------------------------------------------------------------
export KRB_REALM="CHANGE_ME.DOMAIN"                    # 예: SBI.INTERNAL
export KRB_KDC="CHANGE_ME_KDC_HOST"                    # 예: kdc.sbi.internal
export PRINCIPAL="CHANGE_ME@CHANGE_ME.DOMAIN"          # 예: demo-user@SBI.INTERNAL
export KEYTAB="/opt/cloudera/CHANGE_ME.keytab"         # 예: /opt/cloudera/demo-user.keytab

# ----------------------------------------------------------------
# Auto-TLS 인증서 경로 (CDP 표준 경로 — 변경 불필요)
# ----------------------------------------------------------------
export TRUSTSTORE_JKS="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_truststore.jks"
export INCLUSTER_TRUSTSTORE_JKS="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-in_cluster_truststore.jks"
export CA_PEM="/var/lib/cloudera-scm-agent/agent-cert/cm-auto-global_cacerts.pem"

# Truststore 패스워드 — SBI 클러스터 값으로 변경
export TRUSTSTORE_PW="CHANGE_ME_TRUSTSTORE_PW"

# Kafka 설치 경로
export KAFKA_HOME="/opt/cloudera/parcels/CDH/lib/kafka"

# ----------------------------------------------------------------
# Kafka — SBI 클러스터 브로커 호스트명으로 변경
# ----------------------------------------------------------------
export KAFKA_BROKERS="CHANGE_ME_BROKER1:9093,CHANGE_ME_BROKER2:9093,CHANGE_ME_BROKER3:9093"
export KAFKA_TOPIC_TXN="sbi-aml-transactions"
export KAFKA_TOPIC_ALERTS="sbi-aml-alerts"
export KAFKA_PARTITIONS=4
export KAFKA_RF=3

# ----------------------------------------------------------------
# Kudu — SBI 클러스터 Kudu Master 호스트명으로 변경
# ----------------------------------------------------------------
export KUDU_MASTERS="CHANGE_ME_KUDU_MASTER1:7051,CHANGE_ME_KUDU_MASTER2:7051,CHANGE_ME_KUDU_MASTER3:7051"
export KUDU_DB="default"

# ----------------------------------------------------------------
# SQL Stream Builder (SSB)
# ----------------------------------------------------------------
export SSB_HOST="https://CHANGE_ME_SSB_HOST:18121"
export SSB_USER="CHANGE_ME_USER"
export SSB_PASSWORD="CHANGE_ME_PASSWORD"

# ----------------------------------------------------------------
# Impala
# ----------------------------------------------------------------
export IMPALA_HOST="CHANGE_ME_IMPALA_HOST"
export IMPALA_PORT="21050"

# ----------------------------------------------------------------
# CFM / NiFi
# ----------------------------------------------------------------
export NIFI_HOST="https://CHANGE_ME_NIFI_HOST:8443"

# ----------------------------------------------------------------
# 데이터 생성 설정 (변경 불필요)
# ----------------------------------------------------------------
export DATA_OUTPUT_DIR="/tmp/aml-data"
export DEMO_ROWS=2000
export DEMO_RATE=5

export LARGE_CASH_THRESHOLD=1000000
export SMURFING_TXN_COUNT=5
export SMURFING_WINDOW_MIN=30

export LARGE_CASH_ACCOUNTS="ACC_AML_LARGE_001,ACC_AML_LARGE_002"
export SMURFING_ACCOUNTS="ACC_AML_SMURF_001,ACC_AML_SMURF_002,ACC_AML_SMURF_003"
